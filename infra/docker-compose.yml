# Toda imagem travada por digest. Nunca substituir por tag flutuante.
name: route-monitor

services:
  postgres:
    image: postgis/postgis:17-3.5@sha256:83e9999dc3ad8390c210e76130c3a16365ef4f957bb55200d22b7937cfbcb321
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_WEB_PORT}:8025"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL}
      QR_SIGNING_PRIVATE_KEY_HEX: ${QR_SIGNING_PRIVATE_KEY_HEX}
      OSRM_BASE_URL: ${OSRM_BASE_URL}
      ALERTS_SCHEDULER_ENABLED: ${ALERTS_SCHEDULER_ENABLED:-true}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_EVIDENCE: ${MINIO_BUCKET_EVIDENCE}
      MINIO_SECURE: "false"
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      # Bind do código para o --reload do uvicorn funcionar; o .venv fica no
      # volume anônimo para não ser sobrescrito pelo host.
      - ../backend/app:/app/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started
      osrm:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${DASHBOARD_PORT}:5173"
    volumes:
      - ../dashboard/src:/app/src
      - ../dashboard/index.html:/app/index.html
      - dashboard_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0@sha256:729461bcc9ae9e6aafa92c0f93db9b060a32e85d5e72092c01ae4a4a9f1eb564
    # MLD é o algoritmo que corresponde a osrm-partition + osrm-customize.
    command: osrm-routed --algorithm mld /data/campus.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data:ro

volumes:
  postgres_data:
  minio_data:
  backend_venv:
  dashboard_modules:
